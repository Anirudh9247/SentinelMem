[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelmem"
version = "0.1.0"
description = "Reproducible benchmark foundations for retrieval-time memory-poisoning defenses."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "faiss-cpu>=1.10,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.13,<1"]
research = ["sentence-transformers==6.1.0"]

[project.scripts]
sentinelmem = "sentinelmem.cli:main"
sentinelmem-faiss-baseline = "sentinelmem.baseline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F"]
